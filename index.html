<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Typography Portrait - DAHY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .main-wrapper {
            width: 720px;
            height: 721px;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .text-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            /* Background image setup */
            background-image: url('portrait.jpg'); 
            background-size: cover;
            background-position: center;
            
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            
            font-family: 'Inter', sans-serif;
            font-size: 9px; /* Slightly smaller for better definition */
            line-height: 0.9; /* Improved spacing for readability */
            letter-spacing: -0.2px; 
            text-align: justify;
            word-break: break-word; /* Changed to keep words together */
            text-transform: uppercase; /* Makes the "block" look more solid */
            user-select: none;
            z-index: 1;
        }

        .floating-sidebar {
            position: absolute;
            left: 15px;
            bottom: 30px;
            z-index: 10;
        }

        .floating-sidebar h1 {
            writing-mode: vertical-rl;
            text-transform: uppercase;
            font-family: 'Inter', sans-serif;
            font-size: 70px;
            letter-spacing: 12px;
            margin: 0;
            color: #fff;
            transform: rotate(180deg);
            opacity: 0.95;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="floating-sidebar">
            <h1>DAHY</h1>
        </div>

        <div class="text-mask" id="mask"></div>
        <div class="vignette"></div>
    </div>

    <script>
        const mask = document.getElementById('mask');
        const phrase = "i want to be a kid forever "; // Added a space at the end
        
        // This loop repeats the full phrase instead of randomizing letters
        // 500 repetitions is plenty to fill 720x721 at 9px font size
        mask.innerText = phrase.repeat(500); 
    </script>

</body>
</html>
